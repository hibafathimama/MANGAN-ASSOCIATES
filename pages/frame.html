<!DOCTYPE html>
<html>
    <head>
        <title> Frame-page</title>
        <link rel="stylesheet" href="../styles/frame.css">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="frames">
            <div class="rectangle">
                <div class="frame-image">
                <img src="../images/Rectangle 24.png" alt="not available" width="100%" height="100%">
                </div>
            </div>
            <div class="queries">
                <p class="queri-parag">Share your Queries</p>
                <p class="lorem-parag">Lorem ipsum dolor sit amet consectetur. Cursus diam lobortis curabitur nulla eu. Est ornare sed in at augue sed feugiat.</p>
            
                <form>
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name"><br><br>
                    <div class="email-flex">
                        <div class="email-flex1">
                     <label class="email-label" for="email">Email:</label><br>
                     <input  class="email-input"type="email" id="email" name="email">
                        </div>
                        <div class="mobile-flex">
                       <label class="email-label" for="mobile">Mobile Number:</label><br>
                     <input  class="email-input"type="tel" id="mobile" name="mobile">
                    </div>
                    </div>
                    <div>
                    <label for="message">Message:</label><br>
                    <input class="msg-input" type="text" id="message" name="message"><br><br>
                    </div>

                </form>
                <button class="connected">
                    GET CONNECTED
                </button>
            
            </div>

        </div>
    </body>
</html>
